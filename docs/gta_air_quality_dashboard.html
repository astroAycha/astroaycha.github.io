<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTA Air Quality Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      min-height: 0;
    }

    .dashboard-shell {
      width: 100%;
      height: 100%;
      padding: 0;
      margin: 0;
    }

    .dashboard-frame {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .dashboard-frame iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

  </style>
</head>
<body>
  <main>
    <div class="dashboard-shell">
      <div class="dashboard-frame">
        <iframe
          src="https://astroaycha-gta-air-quality.hf.space"
          loading="lazy"
          title="GTA Air Quality Monitor - live PM2.5 dashboard"
        ></iframe>
      </div>
    </div>
  </main>
</body>
</html>
